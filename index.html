<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <title>Welcome to Insty</title>
    <link rel="icon" href="assets/img/logo.png?v=1" />
    <link rel="stylesheet" href="assets/css/style.css?v=1" />
  </head>
  <body>
    <!-- The first-launch onboarding: a few swipeable pages, one paid feature on
         each, then into the app. app.js draws the pages from its PAGES list,
         i18n.js translates them. See README.md. -->
    <div class="app is-loading" id="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand__logo" src="assets/img/logo.png?v=1" alt="" width="30" height="30" />
          <span class="brand__name" id="brand-name">Insty</span>
        </div>
        <span class="counter" id="counter" aria-hidden="true"></span>
      </header>

      <main class="story" id="story">
        <ol class="track" id="track"></ol>
      </main>

      <footer class="bottombar">
        <div class="dots" id="dots"></div>
        <button class="cta" id="cta" type="button"><span id="cta-label"></span></button>
        <p class="footnote" id="footnote"></p>
      </footer>
    </div>

    <script>
      // The app's name, shown next to the logo and wherever a string says {app}.
      window.GUIDE_APP_NAME = 'Insty';
    </script>
    <script src="assets/js/i18n.js?v=1"></script>
    <script src="assets/js/app.js?v=1"></script>
  </body>
</html>
